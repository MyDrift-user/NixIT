ServerTokens Prod
ServerSignature Off
TraceEnable Off

Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "SAMEORIGIN"
Header always set Referrer-Policy "strict-origin-when-cross-origin"
Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
# HSTS only makes sense behind HTTPS; the proxy in front sends it in production.
Header always set Strict-Transport-Security "max-age=31536000" "expr=%{HTTPS} == 'on'"

<Directory /var/www/html>
    <Files xmlrpc.php>
        Require all denied
    </Files>
    <FilesMatch "^(wp-config\.php|readme\.html|license\.txt|\.ht.*)$">
        Require all denied
    </FilesMatch>
</Directory>

# No PHP execution inside uploads.
<Directory /var/www/html/wp-content/uploads>
    <FilesMatch "\.(php|phtml|phar)$">
        Require all denied
    </FilesMatch>
</Directory>

# The bare domain redirects to www (both reach this container through Pangolin).
<If "%{HTTP_HOST} == 'faustoandfurio.ch'">
    Redirect permanent / https://www.faustoandfurio.ch/
</If>
